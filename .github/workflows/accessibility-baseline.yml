name: Accessibility baseline (Android and web)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Normalize Android SDK command-line tools path
        run: |
          SDKMANAGER="$(command -v sdkmanager)"
          test -x "$SDKMANAGER"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sfn "$(dirname "$(dirname "$SDKMANAGER")")" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          cd android
          bash gradlew :app:assembleDebug --no-daemon
      - name: Record APK identity
        run: |
          mkdir -p apk-evidence
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > apk-evidence/sha256.txt
          git rev-parse HEAD > apk-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mooneva-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-evidence/
          if-no-files-found: error
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --prefix ci/accessibility --no-package-lock --no-audit --no-fund playwright@1.63.0 @axe-core/playwright@4.13.0
      - run: ci/accessibility/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser accessibility baseline
        run: |
          mkdir -p web-evidence
          npm run preview -- --host 127.0.0.1 > web-evidence/server.log 2>&1 &
          node ci/accessibility/web-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-accessibility-evidence
          path: web-evidence/
          if-no-files-found: error
  talkback:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALOUD_COMMIT: eec28b88a7e59a0c2a3f4060e261945465f1ca88
      TALKBACK_COMMIT: 229212fdf5842191d0a93fc95d9ca1423b346866
      ALOUD_CACHE: ${{ github.workspace }}/.aloud-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: mooneva-debug-apk
          path: build-evidence
      - name: Prepare emulator and Gradle
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift /usr/local/lib/android/sdk/ndk/27* || true
          df -h
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m' 'org.gradle.daemon=false' 'org.gradle.workers.max=2' > ~/.gradle/gradle.properties
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Normalize Android SDK command-line tools path
        run: |
          SDKMANAGER="$(command -v sdkmanager)"
          test -x "$SDKMANAGER"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sfn "$(dirname "$(dirname "$SDKMANAGER")")" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Fetch pinned Aloud
        run: |
          git clone https://github.com/IRS-Public/aloud.git "$RUNNER_TEMP/aloud"
          git -C "$RUNNER_TEMP/aloud" checkout --detach "$ALOUD_COMMIT"
          npm ci --prefix "$RUNNER_TEMP/aloud" --omit=dev
      - uses: actions/cache/restore@v4
        id: talkback-cache
        with:
          path: .aloud-cache/*.apk
          key: talkback-companion-${{ env.ALOUD_COMMIT }}-${{ env.TALKBACK_COMMIT }}
      - name: Build real TalkBack with test companion
        if: steps.talkback-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/gradle-8.14.3/bin:$PATH"
          node "$RUNNER_TEMP/aloud/bin/aloud.mjs" talkback get --build --companion --no-native
      - uses: actions/cache/save@v4
        if: steps.talkback-cache.outputs.cache-hit != 'true'
        with:
          path: .aloud-cache/*.apk
          key: talkback-companion-${{ env.ALOUD_COMMIT }}-${{ env.TALKBACK_COMMIT }}
      - name: Build independent speech-request recording engine
        run: |
          if [ ! -x "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$RUNNER_TEMP/gradle.zip"
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          fi
          export PATH="$RUNNER_TEMP/gradle-8.14.3/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          node "$RUNNER_TEMP/aloud/bin/aloud.mjs" tts build
      - name: Boot Android 14 emulator
        run: bash "$RUNNER_TEMP/aloud/src/android/boot-emulator-ci.sh"
      - name: Install application and TalkBack
        run: |
          APK=build-evidence/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          (cd build-evidence && sha256sum -c apk-evidence/sha256.txt)
          test "$(cat build-evidence/apk-evidence/commit.txt)" = "$(git rev-parse HEAD)"
          adb shell pm disable-user --user 0 com.google.android.googlequicksearchbox || true
          adb install -r -g "$APK"
          node "$RUNNER_TEMP/aloud/bin/aloud.mjs" talkback install "$ALOUD_CACHE/talkback.apk"
          node "$RUNNER_TEMP/aloud/bin/aloud.mjs" tts install "$ALOUD_CACHE/logging-tts.apk"
          node "$RUNNER_TEMP/aloud/bin/aloud.mjs" talkback status
          adb shell am start -W -n com.mooneva.app.debug/com.mooneva.app.MainActivity
          node "$RUNNER_TEMP/aloud/bin/aloud.mjs" android-ready --target com.mooneva.app.debug --out readiness
      - name: Capture real TalkBack traversal of initial screen
        run: |
          node "$RUNNER_TEMP/aloud/bin/aloud.mjs" android --config ci/accessibility/aloud.config.json --nav current-screen --screen-id onboarding-language --talkback focus --talkback-max-steps 200 --no-gate --out aloud-report
      - name: Extended Android screen and interaction journeys
        run: node ci/accessibility/android-journey.mjs
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          adb logcat -d > diagnostics/logcat.txt || true
          adb shell dumpsys accessibility > diagnostics/accessibility.txt || true
          adb shell dumpsys activity activities > diagnostics/activity.txt || true
          cp "$RUNNER_TEMP/emulator.log" diagnostics/ || true
          printf 'Aloud %s\nTalkBack %s\n' "$ALOUD_COMMIT" "$TALKBACK_COMMIT" > diagnostics/versions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: talkback-baseline-evidence
          path: |
            aloud-report/
            android-journey/
            readiness/
            diagnostics/
            build-evidence/apk-evidence/
          if-no-files-found: error
